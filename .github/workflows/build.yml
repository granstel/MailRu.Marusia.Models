name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build the NuGet package
        run: dotnet pack src/MailRu.Marusia.Models.csproj -c Release -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true -o "$RUNNER_TEMP/feed"
      - name: Test the package on .NET 10
        run: |
          export MARUSIA_PACKAGE_TEST_FEED="$RUNNER_TEMP/feed"
          export NUGET_PACKAGES="$RUNNER_TEMP/package-test-cache"
          version=$(dotnet msbuild src/MailRu.Marusia.Models.csproj -getProperty:Version)
          dotnet restore tests/MailRu.Marusia.Models.Tests.csproj \
            -p:PackageVersionUnderTest="$version" --configfile tests/PackageTest.NuGet.Config
          dotnet test tests/MailRu.Marusia.Models.Tests.csproj -c Release --no-restore \
            -p:PackageVersionUnderTest="$version"
