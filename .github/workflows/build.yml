name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse the tested package on a release retry
        id: retained-package
        if: github.event_name == 'release' && github.run_attempt != '1'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: ${{ runner.temp }}/retained-package
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.retained-package.outcome != 'success'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.retained-package.outcome != 'success'
        with:
          global-json-file: global.json
      - name: Resolve package version
        if: steps.retained-package.outcome != 'success'
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="$RELEASE_TAG"
          else
            version=$(dotnet msbuild src/MailRu.Marusia.Models.csproj -getProperty:Version)
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and test the solution
        if: steps.retained-package.outcome != 'success'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet restore MailRu.Marusia.Models.slnx -p:NuGetAuditMode=all
          dotnet build MailRu.Marusia.Models.slnx -c Release --no-restore \
            -p:ContinuousIntegrationBuild=true -p:Version="$PACKAGE_VERSION"
          dotnet test --solution MailRu.Marusia.Models.slnx -c Release --no-build
      - name: Pack the library
        if: steps.retained-package.outcome != 'success'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet pack src/MailRu.Marusia.Models.csproj -c Release --no-build \
            -p:ContinuousIntegrationBuild=true -p:Version="$PACKAGE_VERSION" -o "$RUNNER_TEMP/feed"
      - name: Test the package on .NET 10
        if: steps.retained-package.outcome != 'success'
        env:
          PackageVersionUnderTest: ${{ steps.version.outputs.value }}
        run: |
          export MARUSIA_PACKAGE_TEST_FEED="$RUNNER_TEMP/feed"
          export NUGET_PACKAGES="$RUNNER_TEMP/package-test-cache"
          dotnet restore tests/MailRu.Marusia.Models.Tests.csproj \
            -p:NuGetAuditMode=all --configfile tests/PackageTest.NuGet.Config
          dotnet test --project tests/MailRu.Marusia.Models.Tests.csproj -c Release --no-restore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.retained-package.outcome != 'success'
        with:
          name: nuget-package
          path: ${{ runner.temp }}/feed/*.nupkg
          if-no-files-found: error
          overwrite: ${{ github.event_name != 'release' }}
