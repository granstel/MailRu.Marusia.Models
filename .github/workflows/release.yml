name: Publish package

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: package
      - name: Attach the tested package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          packages=(package/*.nupkg)
          package="${packages[0]}"
          name="${package##*/}"
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -Fxq -- "$name" <<< "$assets"; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$name" --dir "$RUNNER_TEMP/release-asset"
            if ! cmp -- "$package" "$RUNNER_TEMP/release-asset/$name"; then
              echo 'The release already has an asset with this name and different bytes.' >&2
              exit 1
            fi
          else
            gh release upload "$RELEASE_TAG" "$package" --repo "$GITHUB_REPOSITORY"
          fi

  publish-nuget:
    needs: attach-to-release
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: package
      - uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push package/*.nupkg --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate

  publish-github:
    needs: attach-to-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: package
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget push package/*.nupkg --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --api-key "$GITHUB_TOKEN" --skip-duplicate
